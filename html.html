<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Virtual Tour & AR Experience</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #c5a059;
            --gold-hover: #d4b26f;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --btn-ar: #2b6cb0;
            --btn-ar-hover: #3182ce;
            --btn-video: #2d3748;
            --btn-video-hover: #4a5568;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobile Container Simulation */
        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 846px;
            background-color: var(--bg-color);
            border: 12px solid #2a2a2a;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Status Bar Simulation */
        .status-bar {
            height: 30px;
            background-color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* App Header */
        .app-header {
            text-align: center;
            padding: 18px 0;
            background: linear-gradient(to bottom, #1a1a1a, #121212);
            border-bottom: 1px solid #2c2c2c;
        }

        .app-header h1 {
            color: var(--gold);
            font-size: 18px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Content Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .content-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .content-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* Tour Cards */
        .tour-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid #2c2c2c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .tour-card h2 {
            font-size: 15px;
            color: var(--gold);
            padding: 12px 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2c2c2c;
        }

        .card-media {
            width: 100%;
            height: 160px;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        /* Action Buttons Grid */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px 16px;
        }

        .btn {
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-ar {
            background-color: var(--btn-ar);
            color: #fff;
        }
        .btn-ar:hover {
            background-color: var(--btn-ar-hover);
        }

        .btn-video {
            background-color: var(--btn-video);
            color: var(--text-main);
            border: 1px solid #4a5568;
        }
        .btn-video:hover {
            background-color: var(--btn-video-hover);
        }

        /* Navigation Bar Simulation */
        .nav-bar {
            height: 40px;
            background-color: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
        }

        .nav-icon {
            width: 14px;
            height: 14px;
            border: 2px solid var(--text-muted);
            border-radius: 2px;
        }
        .nav-icon.circle {
            border-radius: 50%;
        }
        .nav-icon.triangle {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 12px solid var(--text-muted);
            border-top: none;
            border-radius: 0;
        }

        /* Modal Overlay for Action Simulation */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            border: 1px solid var(--gold);
        }

        .modal-content h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 16px;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .modal-close {
            background: var(--gold);
            color: #000;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="status-bar">
            <span>10:09 AM</span>
            <span>5G 🔋</span>
        </div>

        <header class="app-header">
            <h1>Castle <span>🏰</span> Virtual Tour</h1>
        </header>

        <div class="content-scroll">
            
            <div class="tour-card">
                <h2>Grand Hall</h2>
                <div class="card-media">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='160' fill='%23222'><rect width='400' height='160'/><text x='50%' y='50%' fill='%23666' font-size='14' text-anchor='middle' dominant-baseline='middle'>Grand Hall Preview Asset</text></svg>" alt="Grand Hall">
                </div>
                <div class="card-actions">
                    <button class="btn btn-ar" onclick="triggerAction('Grand Hall', 'AR')">Launch AR</button>
                    <button class="btn btn-video" onclick="triggerAction('Grand Hall', 'Video')">Watch Video</button>
                </div>
            </div>

            <div class="tour-card">
                <h2>Dining Room</h2>
                <div class="card-media">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='160' fill='%23222'><rect width='400' height='160'/><text x='50%' y='50%' fill='%23666' font-size='14' text-anchor='middle' dominant-baseline='middle'>Dining Room Preview Asset</text></svg>" alt="Dining Room">
                </div>
                <div class="card-actions">
                    <button class="btn btn-ar" onclick="triggerAction('Dining Room', 'AR')">Launch AR</button>
                    <button class="btn btn-video" onclick="triggerAction('Dining Room', 'Video')">Watch Video</button>
                </div>
            </div>

            <div class="tour-card">
                <h2>Library</h2>
                <div class="card-media">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='160' fill='%23222'><rect width='400' height='160'/><text x='50%' y='50%' fill='%23666' font-size='14' text-anchor='middle' dominant-baseline='middle'>Library Preview Asset</text></svg>" alt="Library">
                </div>
                <div class="card-actions">
                    <button class="btn btn-ar" onclick="triggerAction('Library', 'AR')">Launch AR</button>
                    <button class="btn btn-video" onclick="triggerAction('Library', 'Video')">Watch Video</button>
                </div>
            </div>

        </div>

        <div class="nav-bar">
            <div class="nav-icon"></div>
            <div class="nav-icon circle"></div>
            <div class="nav-icon triangle"></div>
        </div>

        <div class="modal" id="actionModal">
            <div class="modal-content">
                <h3 id="modalTitle">Experience Triggered</h3>
                <p id="modalText">Initializing module...</p>
                <button class="modal-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        function triggerAction(roomName, type) {
            const modal = document.getElementById('actionModal');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');

            if (type === 'AR') {
                title.innerText = `Launching AR: ${roomName}`;
                text.innerText = `Initializing camera tracking and loading 3D avatar characters for the ${roomName}...`;
            } else {
                title.innerText = `Playing Video: ${roomName}`;
                text.innerText = `Streaming high-definition video tour for the ${roomName}...`;
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('actionModal');
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
